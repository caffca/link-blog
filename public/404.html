<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面跳转中...</title>
    <script>
      // SPA 路由回退：把任意路径重定向到首页 hash 路由
      var target = '/link-blog/'
      if (window.location.pathname && window.location.pathname !== target) {
        target += '#/'
      }
      window.location.replace(target)
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; padding-top: 40vh; color: #64748b">
      正在跳转到电子协会资料库...
    </p>
  </body>
</html>
